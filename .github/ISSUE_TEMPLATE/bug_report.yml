name: Bug report
description: Report a problem with mpml or the Dashboard.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Apple chip and project commit or build date.
      placeholder: macOS 15, M-series chip, commit abc1234
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or Dashboard controls you used.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized error output or screenshot (optional)
      description: Remove personal paths, process names and other private information. Do not upload history databases or raw exports.
