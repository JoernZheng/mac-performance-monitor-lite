name: Recorder CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  recorder:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/build.sh
      - run: Scripts/test.sh
      - run: swift format lint --strict --recursive Sources Tests Package.swift
